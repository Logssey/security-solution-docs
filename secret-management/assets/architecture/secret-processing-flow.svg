<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">시크릿 처리 과정: 탐지부터 대응 가이드와 재검사까지</title>
  <desc id="desc">승인된 GitHub, Notion, AWS 원천에서 읽기 전용으로 수집하고 Gitleaks 탐지, 후보 정규화, 유형별 유효성 검증, 노출과 영향 판단, 위치별 대응과 재검사를 거쳐 근거를 PostgreSQL에 저장하는 구조도</desc>
  <defs>
    <style>
      text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#251f1b}
      .head{font-size:34px;font-weight:800}.sub{font-size:19px;fill:#5d5550}
      .box{fill:#fff;stroke:#443b35;stroke-width:2;stroke-dasharray:9 6;rx:18}
      .h{font-size:22px;font-weight:800}.t{font-size:16px;font-weight:700}.s{font-size:14px;fill:#5d5550}
      .chip{fill:#f1f5f8;stroke:#c5d2dc;stroke-width:1.5;rx:9}
      .warm{fill:#fff5e9;stroke:#e7cba8;stroke-width:1.5;rx:9}
      .green{fill:#edf7f0;stroke:#b8d8c0;stroke-width:1.5;rx:9}
      .line{fill:none;stroke:#463c35;stroke-width:2.5;marker-end:url(#arrow)}
      .dotted{fill:none;stroke:#867c75;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#arrowMuted)}
      .lbl{font-size:13px;fill:#645b54;font-weight:700}
      .mini{font-size:13px;fill:#5d5550}
      .pill{fill:#fff;stroke:#bbcbd6;stroke-width:1.4;rx:8}
      .ptext{font-size:14px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#463c35"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#867c75"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fbf8f2"/>
  <text class="head" x="64" y="69">시크릿 처리 과정</text>
  <text class="sub" x="66" y="103">탐지 후보 → 유효성 확인 · 노출·영향 판단 → 위치별 대응과 재검사</text>

  <rect class="box" x="64" y="160" width="206" height="506"/>
  <text class="h" x="84" y="201">키 수집 대상</text>
  <text class="s" x="84" y="229">승인 범위 · 읽기 전용</text>
  <rect class="chip" x="84" y="264" width="166" height="58"/>
  <circle cx="109" cy="293" r="13" fill="#282728"/><text x="135" y="299" class="t">GitHub</text>
  <rect class="chip" x="84" y="340" width="166" height="58"/>
  <rect x="96" y="355" width="26" height="27" rx="4" fill="#282728"/><text x="103" y="376" font-size="20" font-weight="800" fill="#fff">N</text><text x="135" y="375" class="t">Notion</text>
  <rect class="chip" x="84" y="416" width="166" height="58"/>
  <rect x="95" y="433" width="29" height="24" rx="4" fill="#263848"/><text x="99" y="450" font-size="13" font-weight="800" fill="#fff">aws</text><text x="135" y="451" class="t">AWS</text>
  <text class="s" x="85" y="511">파일·문서·승인된 값 본문</text>
  <text class="s" x="85" y="536">연결별 성공·실패 범위 기록</text>
  <text class="s" x="85" y="561">목록 메타데이터는 별도</text>
  <text class="s" x="85" y="585">인벤토리로 관리</text>

  <rect class="box" x="330" y="160" width="340" height="286"/>
  <text class="h" x="352" y="201">룰 기반 탐지</text>
  <rect class="chip" x="354" y="237" width="126" height="54"/>
  <text class="t" x="374" y="270">Gitleaks</text>
  <path class="line" d="M485 264 H513"/>
  <rect class="chip" x="520" y="237" width="125" height="54"/>
  <text class="t" x="537" y="259">유형·구성</text><text class="t" x="542" y="279">요소 확인</text>
  <path class="line" d="M583 301 V324"/>
  <rect class="warm" x="354" y="331" width="291" height="69"/>
  <text class="t" x="378" y="358">후보 정규화·중복 제거</text>
  <text class="s" x="378" y="380">키 식별 근거 + 발견 위치 연결</text>
  <text class="s" x="354" y="426">형식 일치 = 탐지 후보, 유효성 아님</text>

  <rect class="box" x="330" y="492" width="340" height="226"/>
  <text class="h" x="352" y="533">유효성 판단</text>
  <rect class="chip" x="354" y="561" width="291" height="61"/>
  <text class="t" x="372" y="585">유형별 검증기 → 승인된 최소 요청</text>
  <text class="s" x="372" y="607">예: AWS STS · GitHub 주체 확인</text>
  <text class="t" x="354" y="653">VALID · INVALID</text>
  <text class="t" x="354" y="677">UNKNOWN · UNCHECKED</text>
  <text class="s" x="354" y="701">인증 가능성과 실제 권한은 별도</text>

  <rect class="box" x="728" y="160" width="500" height="558"/>
  <text class="h" x="750" y="201">노출·영향·심각도 판단</text>
  <rect class="chip" x="752" y="235" width="452" height="94"/>
  <text class="t" x="772" y="263">① 노출 상태·범위</text>
  <rect class="pill" x="772" y="278" width="168" height="34"/>
  <text class="ptext" x="785" y="300">위치별 보관 정책</text>
  <rect class="pill" x="952" y="278" width="232" height="34"/>
  <text class="ptext" x="965" y="300">실제 접근 주체·공개 범위</text>
  <path class="line" d="M978 336 V356"/>

  <rect class="chip" x="752" y="363" width="452" height="114"/>
  <text class="t" x="772" y="391">② 키 확인·권한 영향</text>
  <rect class="pill" x="772" y="406" width="118" height="34"/>
  <text class="ptext" x="785" y="428">키 구성요소</text>
  <rect class="pill" x="900" y="406" width="128" height="34"/>
  <text class="ptext" x="913" y="428">가능한 동작</text>
  <rect class="pill" x="1038" y="406" width="146" height="34"/>
  <text class="ptext" x="1051" y="428">적용 대상 자원</text>
  <text class="ptext" x="772" y="462">등록된 자산 분류·제한 통제까지 확인</text>
  <path class="line" d="M978 484 V504"/>

  <rect class="warm" x="752" y="511" width="452" height="76"/>
  <text class="t" x="772" y="539">③ 중대한 악용 증거</text>
  <text class="ptext" x="772" y="565">비인가 사용과 중요 자원·민감 데이터 영향</text>
  <path class="line" d="M978 594 V612"/>

  <rect class="green" x="752" y="619" width="452" height="85"/>
  <text class="t" x="772" y="645">5개 축의 확인된 근거 → 심각도 규칙에 매핑</text>
  <rect x="772" y="657" width="90" height="26" rx="7" fill="#e9bdad"/>
  <text class="ptext" x="779" y="675">CRITICAL</text>
  <rect x="869" y="657" width="80" height="26" rx="7" fill="#f1d0aa"/>
  <text class="ptext" x="887" y="675">HIGH</text>
  <rect x="956" y="657" width="100" height="26" rx="7" fill="#f3e3ae"/>
  <text class="ptext" x="971" y="675">MEDIUM</text>
  <rect x="1063" y="657" width="64" height="26" rx="7" fill="#c4dfc9"/>
  <text class="ptext" x="1079" y="675">LOW</text>
  <text class="mini" x="1137" y="675">미평가</text>
  <text class="mini" x="772" y="697">확정된 비정상 노출만 대응 건에 연결</text>

  <rect class="box" x="1260" y="160" width="276" height="558"/>
  <text class="h" x="1280" y="201">대응 가이드</text>
  <rect class="chip" x="1280" y="238" width="236" height="65"/>
  <text class="t" x="1296" y="265">담당자·다음 행동</text>
  <text class="s" x="1296" y="287">기본 가이드·체크리스트</text>
  <path class="line" d="M1398 311 V331"/>
  <rect class="warm" x="1280" y="338" width="236" height="86"/>
  <text class="t" x="1296" y="365">외부 조치</text>
  <text class="s" x="1296" y="389">교체·폐기·노출 위치 제거</text>
  <text class="s" x="1296" y="411">담당자가 수행 근거 기록</text>
  <path class="line" d="M1398 431 V451"/>
  <rect class="green" x="1280" y="458" width="236" height="86"/>
  <text class="t" x="1296" y="485">조치 후 재검사</text>
  <text class="s" x="1296" y="508">PRESENT / MISSING</text>
  <text class="s" x="1296" y="530">/ UNKNOWN · 수명주기 확인</text>
  <text class="s" x="1280" y="581">모든 근거 충족 시</text>
  <text class="s" x="1280" y="605">보안 담당자가 해결 확인</text>
  <text class="s" x="1280" y="674">가이드만으로 완료 아님</text>

  <path class="line" d="M277 301 H320"/>
  <path class="line" d="M500 453 V482"/>
  <path class="line" d="M677 300 H718"/>
  <path class="line" d="M1235 438 H1250"/>
  <path class="dotted" d="M323 625 H296 V620 H280"/>
  <text class="lbl" x="68" y="708">검증 때만 승인 원천에서 원문 재취득</text>

  <rect x="330" y="772" width="1206" height="81" rx="15" fill="#eae5dc" stroke="#b6ada2" stroke-width="1.5"/>
  <ellipse cx="377" cy="793" rx="19" ry="7" fill="#fff" stroke="#463c35" stroke-width="2"/>
  <path d="M358 793 V829 Q377 843 396 829 V793" fill="#fff" stroke="#463c35" stroke-width="2"/>
  <path d="M358 807 Q377 821 396 807 M358 819 Q377 833 396 819" fill="none" stroke="#463c35" stroke-width="2"/>
  <text class="t" x="419" y="808">PostgreSQL</text>
  <text class="s" x="419" y="833">실행 범위 · 후보/위치 · 검증 시도 · 판정 근거 · 대응/재검사 이력</text>
  <path class="dotted" d="M500 724 V760"/>
  <path class="dotted" d="M978 724 V760"/>
  <path class="dotted" d="M1398 724 V760"/>
  <text class="s" x="65" y="819">비밀 원문은 저장하지 않음</text>
</svg>
